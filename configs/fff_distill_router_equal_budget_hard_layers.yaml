study_name: fff_l7k_router_equal_budget_hard_layers_train_eval
sampler: cases
objective: validation_normalized_mse
direction: minimize
max_trials: 21
description: Strict equal-budget hard out_proj router comparison for fff-l7k.
execution_contract:
  sample_split: train_eval
  metric_split: holdout
  metric_holdout_fraction: 0.10
  test_accessed: false
  launch_seeds: [21001, 21002, 21003]
  seed_scope: case override; generated distill_config.yaml top-level seed must match launch_seed.
cases:
  - name: vanilla_ste_seed21001
    launch_seed: 21001
    router_family: vanilla_ste
    overrides: &vanilla
      seed: 21001
      include_indices: [35, 39, 41, 43, 45, 47]
      router_recipe: vanilla_ste
      shared_unrouted_frac: 0.20
      route_rows: 1
      route_result_rows: 2
      leaf_rows: 4
      depth: 5
      route_rows_contribute: true
      route_row_role: split_routing_output
      route_rows_output_count: all
      route_rows_output_fraction: 0.5
      activation: silu
      hard_routing: true
      region_leak: 0.01
      master_leaf: false
      balance_recipe: split_minleaf
      balance_coeff: 0.001
      min_leaf_tokens: 64
      locoprop_refit: every_500
  - name: vanilla_ste_seed21002
    launch_seed: 21002
    router_family: vanilla_ste
    overrides:
      <<: *vanilla
      seed: 21002
  - name: vanilla_ste_seed21003
    launch_seed: 21003
    router_family: vanilla_ste
    overrides:
      <<: *vanilla
      seed: 21003
  - name: clipped_ste_seed21001
    launch_seed: 21001
    router_family: clipped_ste
    overrides: &clipped
      <<: *vanilla
      seed: 21001
      router_recipe: clipped_ste
      tau: 1.0
      clip_margin: 1.0
  - name: clipped_ste_seed21002
    launch_seed: 21002
    router_family: clipped_ste
    overrides:
      <<: *clipped
      seed: 21002
  - name: clipped_ste_seed21003
