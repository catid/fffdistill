seed: 1337
dataset:
  name: cifar10
  data_dir: data/cifar10
  train_size: 45000
  val_size: 5000
  use_test: false
model:
  d_model: 256
  depth: 20
  patch_size: 4
  d_state: 64
  expand: 2
  headdim: 64
  is_mimo: true
  mimo_rank: 2
  bidirectional: false
  drop_path: 0.1
train:
  epochs: 200
  batch_size_per_gpu: 512
  precision: bf16
  # optimizer options:
  #   muon_adamw / official_muon: official KellerJordan/Muon baseline.
  #   pace_muon: official Muon baseline wrapped with optimizer_experiments PACE.
  #   normuon_adamw / muon_normuon: vendored Muon+NorMuon ablation.
  #   pace_normuon: vendored Muon+NorMuon wrapped with PACE.
  optimizer: muon_adamw
  # schedule options: cosine, wsd. WSD holds the base LR through
  # wsd_stable_fraction of total steps before the final cosine decay.
  schedule: cosine
  warmup_epochs: 10
  wsd_stable_fraction: 0.8
  lr_muon: 0.02
  lr_adamw: 0.001
  weight_decay_muon: 0.03
  weight_decay_adamw: 0.03
  pace_pullback_c: 0.001
  pace_kappa: 0.5
  pace_precond: adam
  pace_beta2: 0.999
  pace_eps: 1.0e-8
  pace_update_freq: 1
  normuon_beta2: 0.93
  normuon_eps: 1.0e-10
  label_smoothing: 0.1
  mixup: 0.2
  cutmix: 1.0
