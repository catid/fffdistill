study_name: generated_sublinear_baselines_validation
objective: val_accuracy
direction: maximize
max_trials: 15
description: Validation-only official fastfeedforward and sparse row/column/checkerboard baselines.
cases:
  - &official_31001
    name: official_fastfeedforward_seed31001
    seed: 31001
    student_source: official_fastfeedforward
    allow_matched_linear_baseline: true
    baseline_budget_source: fff_config
    baseline_parameter_budget_fraction: 1.0
    fine_tune_epochs: 3
    batch_size_per_gpu: 32
    num_workers: 4
    optimizer_family: muon_adamw
    schedule: cosine
    lr_muon: 0.001
    lr_adamw: 0.0001
    kd_temperature: 4
    lambda_kd: 0.7
    lambda_ce: 0.3
    lambda_hidden: 0.05
    lambda_balance: 0.0
    balance_recipe: none
  - <<: *official_31001
    name: official_fastfeedforward_seed31002
    seed: 31002
  - <<: *official_31001
    name: official_fastfeedforward_seed31003
    seed: 31003
  - &sparse_row_31001
    <<: *official_31001
    name: sparse_row_seed31001
    student_source: sparse_row
    sparse_row_banks: 64
    sparse_rows_per_token: 4
    sparse_activation: silu
  - <<: *sparse_row_31001
    name: sparse_row_seed31002
    seed: 31002
  - <<: *sparse_row_31001
    name: sparse_row_seed31003
    seed: 31003
  - &sparse_column_31001
    <<: *official_31001
    name: sparse_column_seed31001
    student_source: sparse_column
    sparse_column_blocks: 2
    sparse_column_blocks_per_token: 1
  - <<: *sparse_column_31001
    name: sparse_column_seed31002
    seed: 31002
  - <<: *sparse_column_31001
    name: sparse_column_seed31003
    seed: 31003
  - &sparse_row_column_31001
    <<: *official_31001
    name: sparse_row_column_seed31001
    student_source: sparse_row_column
    sparse_row_banks: 64
    sparse_rows_per_token: 4
    sparse_column_blocks: 2
    sparse_column_blocks_per_token: 1
    sparse_activation: silu
  - <<: *sparse_row_column_31001
    name: sparse_row_column_seed31002
    seed: 31002
  - <<: *sparse_row_column_31001
    name: sparse_row_column_seed31003
    seed: 31003
  - &checkerboard_31001
    <<: *official_31001
    name: checkerboard_moe_seed31001
    student_source: checkerboard_moe
    sparse_row_banks: 2
    sparse_rows_per_token: 1
    sparse_column_blocks: 2
    sparse_column_blocks_per_token: 1
  - <<: *checkerboard_31001
    name: checkerboard_moe_seed31002
    seed: 31002
  - <<: *checkerboard_31001
    name: checkerboard_moe_seed31003
    seed: 31003
